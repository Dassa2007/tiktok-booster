<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Free Views & Likes</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f0f0f; color: white; text-align: center; padding: 30px; }
        .container { max-width: 500px; margin: auto; background: #1a1a1a; padding: 25px; border-radius: 12px; border: 1px solid #333; }
        h1 { color: #fe2c55; }
        input, select { width: 90%; padding: 12px; margin: 10px 0; background: #2b2b2b; border: 1px solid #444; color: white; border-radius: 6px; }
        button { background: #fe2c55; color: white; border: none; padding: 12px 20px; width: 95%; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #e0244c; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>TikTok Booster Panel</h1>
        <p>Get instant free views & likes powered by Node.js Backend</p>

        <form id="boostForm">
            <input type="text" id="link" placeholder="Paste TikTok Video Link here..." required>
            <select id="type">
                <option value="Views">TikTok Views</option>
                <option value="Likes">TikTok Likes</option>
            </select>
            <button type="submit">Submit Request</button>
        </form>

        <p id="status"></p>
    </div>

    <script>
        document.getElementById('boostForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const link = document.getElementById('link').value;
            const type = document.getElementById('type').value;
            const status = document.getElementById('status');

            status.style.color = "orange";
            status.innerText = "Processing request on Backend...";

            try {
                const response = await fetch('/api/boost', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ link, type })
                });
                const data = await response.json();

                if(data.success) {
                    status.style.color = "limegreen";
                    status.innerText = data.message;
                } else {
                    status.style.color = "red";
                    status.innerText = data.message;
                }
            } catch (err) {
                status.style.color = "red";
                status.innerText = "ဆာවර් දෝෂයක් (Server Error) සිදු විය!";
            }
        });
    </script>
</body>
</html>
